[package]
name = "scree"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
# Per-character terminal width for TUI wrapping; ratatui already pulls it in,
# this only names it so the code can call it directly.
unicode-width = "0.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"

[dev-dependencies]
insta = "1.49.0"
rusqlite = "0.42.0"
serde_json = "1.0.154"

[lib]
name = "scree"
path = "src/lib.rs"

[[bin]]
name = "scree"
path = "src/main.rs"
